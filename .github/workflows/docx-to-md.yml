name: Convert DOCX to Markdown

on:
  push:
    branches: [main]
    paths:
      - '**.docx'
      - 'scripts/docx_to_markdown.py'
      - '.github/workflows/docx-to-md.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert DOCX files
        run: python scripts/docx_to_markdown.py

      - name: Commit Markdown output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Convert DOCX review to Markdown"
            git push
          else
            echo "No Markdown changes to commit."
          fi
